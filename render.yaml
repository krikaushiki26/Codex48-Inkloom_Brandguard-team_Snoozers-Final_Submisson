databases:
  - name: inkloom-brandguard-db
    plan: free
    databaseName: inkloom_brandguard
    user: inkloom_brandguard

services:
  - type: web
    name: inkloom-brandguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inkloom-brandguard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
